function generatedPresets(cat){if(presets[cat])return presets[cat];let ks=categories[cat]||[];return ks.slice(0,3).map((k,i)=>({level:i===0?'Department':'Individual',kpi:k,target:'',unit:'กำหนดตาม Baseline',direction:/cost|cpl|cpql|cac|cpc|time|aging|variance|revision/i.test(k)?'lower':'higher',period:'Monthly',bsc:/revenue|roi|roas|cost|cac|cpl|cpql|budget/i.test(k)?'Financial':/lead|customer|inquiry|retention|satisfaction/i.test(k)?'Customer':'Internal Process',measureType:'Quantity · เชิงปริมาณ',objective:'กำหนด Target จาก Baseline และเป้าหมายของหมวด '+cat,example:'ตั้ง '+k+' ให้ดีขึ้นจาก Baseline และกำหนด Target ที่วัดผลได้'}))}
function usePreset(cat,idx){let p=generatedPresets(cat)[idx];current='ตั้งเป้าหมาย KPI';render();setTimeout(()=>{level.value=p.level;parent.value=p.level==='Department'?'Organization KPI':p.level==='Individual'?'Department KPI':'';bsc.value=p.bsc;measureType.value=p.measureType;period.value=p.period;catEl=document.getElementById('cat');catEl.value=cat;syncKpi();let kp=document.getElementById('kpi');if(![...kp.options].some(o=>o.value===p.kpi)){kp.add(new Option(p.kpi,p.kpi))}kp.value=p.kpi;target.value=p.target;unit.value=p.unit;dir.value=p.direction;reason.value=p.objective+' | ตัวอย่าง: '+p.example;},0)}

function latestActual(r){if(r.evaluations&&r.evaluations.length)return r.evaluations[r.evaluations.length-1].actual;return r.actual}
function ach(r){let t=+r.target,a=+latestActual(r);if(!t||!isFinite(a))return 0;return r.direction==='lower'?(a===0?150:t/a*100):a/t*100}
function requiredPeriods(r){return durationMap[r.duration]||1}
function completedPeriods(r){return new Set((r.evaluations||[]).map(e=>String(e.periodNo))).size}
function periodProgress(r){return completedPeriods(r)+'/'+requiredPeriods(r)}
function canCloseKPI(r){return completedPeriods(r)>=requiredPeriods(r)}

function ratingFromAchievement(p){
 if(p>=120)return {score:5,label:'Outstanding'};
 if(p>=100)return {score:4,label:'Exceeds Expectation'};
 if(p>=90)return {score:3,label:'Meets Expectation'};
 if(p>=75)return {score:2,label:'Needs Improvement'};
 return {score:1,label:'Critical'};
}
function ratingBadge(p){

 return `<span class="rating-badge rating-${r.score}">${r.score} · ${r.label}</span>`;
}

function recordMatchesFilter(r,f){
 if(f.year && String(r.cycleYear)!==String(f.year))return false;
 if(f.cycle && r.evaluationCycle!==f.cycle)return false;
 if(f.employee && r.employee!==f.employee)return false;
 if(f.level && r.level!==f.level)return false;
 if(f.status && r.kpiStatus!==f.status)return false;
 if(f.approval && (r.approvalStatus||'Draft')!==f.approval)return false;
 if(f.bsc && r.bsc!==f.bsc)return false;
 if(f.q){
   const hay=[r.kpi,r.category,r.owner,r.employee,r.parent,r.reason].join(' ').toLowerCase();
   if(!hay.includes(f.q.toLowerCase()))return false;
 }
 return true;
}

function healthIssues(r){
 const issues=[];
 if(!r.kpi)issues.push('ไม่มีชื่อ KPI');
 if(r.target===''||r.target==null)issues.push('ไม่มี Target');
 if(r.level!=='Organization'&&!r.owner&&!r.employee)issues.push('ไม่มี Owner');
 if(r.level==='Department'&&!r.parent)issues.push('ไม่มี Parent Organization KPI');
 if(!r.source)issues.push('ไม่มี Data Source');
 if(!r.deadline)issues.push('ไม่มี Deadline');
 if(r.kpiStatus!=='Closed' && completedPeriods(r)<requiredPeriods(r) && r.deadline){
   const today=new Date().toISOString().slice(0,10);
   if(r.deadline<today)issues.push('KPI เลย Deadline แต่ Actual ยังไม่ครบ');
 }
 return issues;
}
function healthScore(r){
 const total=6;
 return Math.max(0,Math.round((total-Math.min(healthIssues(r).length,total))/total*100));
}
function allHealthAlerts(){
 const alerts=[];

  healthIssues(r).forEach(msg=>alerts.push({index:i,kpi:r.kpi,msg,level:r.level,owner:r.employee||r.owner||'องค์กร'}));
 });
 return alerts;
}

function compareValue(current,previous){
 if(previous==null||previous===0||current==null)return null;
 return (current-previous)/Math.abs(previous)*100;
}

function orgExecutiveMetrics(){
 const orgs=records.filter(r=>r.level==='Organization'&&r.kpiStatus!=='Closed');
 const dep=records.filter(r=>r.level==='Department'&&r.kpiStatus!=='Closed');
 const measured=records.filter(r=>latestActual(r)!==''&&latestActual(r)!=null);
 const avg=measured.length?measured.reduce((s,r)=>s+Math.min(ach(r),150),0)/measured.length:0;
 const critical=measured.filter(r=>ach(r)<75).length;
 const ontrack=measured.filter(r=>ach(r)>=90).length;
 const overdue=records.filter(r=>r.deadline && r.deadline<new Date().toISOString().slice(0,10) && r.kpiStatus!=='Closed' && !canCloseKPI(r)).length;
 return {orgs,dep,avg,critical,ontrack,overdue};
}
function findLatestRecord(kpi,owner=''){
 return records.filter(r=>r.kpi===kpi && (!owner || (r.employee||r.owner||'')===owner))
   .sort((a,b)=>String(b.cycleYear||'').localeCompare(String(a.cycleYear||''))||cycleOrder(b.evaluationCycle)-cycleOrder(a.evaluationCycle))[0];
}
function targetDelta(r){
 const hist=r.targetHistory||[];
 if(!hist.length)return null;
 const prev=Number(hist[hist.length-1].target);
 const cur=Number(r.target);
 if(!isFinite(prev)||prev===0||!isFinite(cur))return null;
 return (cur-prev)/Math.abs(prev)*100;
}

function parseCSV(text){
 const lines=text.replace(/\r/g,'').split('\n').filter(x=>x.trim());
 if(!lines.length)return [];
 const headers=lines[0].split(',').map(x=>x.trim().replace(/^"|"$/g,''));
 return lines.slice(1).map(line=>{
   const vals=[];let cur='',q=false;
   for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){q=!q}else if(ch===','&&!q){vals.push(cur);cur=''}else cur+=ch}vals.push(cur);
   const o={};headers.forEach((h,i)=>o[h]=(vals[i]||'').trim());return o;
 });
}
function importKpiCSV(file){
 const rd=new FileReader();
 rd.onload=()=>{
   try{
     const rows=parseCSV(rd.result);
     if(!rows.length)throw new Error('ไม่พบข้อมูล');
     const added=rows.map((x,i)=>({
       id:'KPI-IMPORT-'+Date.now()+'-'+i,
       level:x.level||'Individual',parent:x.parent||'',bsc:x.bsc||'Internal Process',
       measureType:x.measureType||'Quantity · เชิงปริมาณ',period:x.period||'',
       category:x.category||'',kpi:x.kpi||x.KPI||'',baseline:x.baseline||0,target:x.target||0,
       unit:x.unit||'',direction:x.direction||'higher',weight:x.weight||10,
       employee:x.employee||'',owner:x.owner||'',source:x.source||'',
       frequency:x.frequency||'Monthly',duration:x.duration||'1 เดือน',
       cycleYear:x.cycleYear||String(new Date().getFullYear()+543),evaluationCycle:x.evaluationCycle||'Annual',
       deadline:x.deadline||'',reason:x.reason||'',actual:'',evaluations:[],kpiStatus:'Active',
       approvalStatus:'Draft',targetLocked:false,templateStatus:'Recommended',
       benchmarkTarget:'',targetHistory:[],reviewHistory:[],changeLog:[],closedAt:'',createdAt:new Date().toISOString()
     })).filter(x=>x.kpi);
     records.push(...added);save();alert(`Import ${added.length} KPI สำเร็จ`);current='Performance Explorer';render();
   }catch(e){alert('Import ไม่สำเร็จ: '+e.message)}
 };
 rd.readAsText(file,'utf-8');
}

function notificationItems(){
 const today=new Date();
 const todayStr=today.toISOString().slice(0,10);
 const plus7=new Date(today);plus7.setDate(plus7.getDate()+7);
 const plus7Str=plus7.toISOString().slice(0,10);
 const items=[];
 records.forEach((r,i)=>{
   if(r.kpiStatus==='Closed')return;
   if(r.deadline && r.deadline<todayStr && !canCloseKPI(r)){
     items.push({type:'danger',icon:'⏰',title:'KPI Overdue',text:r.kpi+' เลย Deadline แล้ว',index:i});
   }else if(r.deadline && r.deadline>=todayStr && r.deadline<=plus7Str){
     items.push({type:'warning',icon:'📅',title:'Deadline ใกล้ถึง',text:r.kpi+' ครบกำหนด '+r.deadline,index:i});
   }
   if(r.level==='Department' && !r.parent){
     items.push({type:'warning',icon:'🔗',title:'ยังไม่เชื่อม Organization KPI',text:r.kpi,index:i});
   }
   if(r.level!=='Organization' && !(r.employee||r.owner)){
     items.push({type:'warning',icon:'👤',title:'ยังไม่มี Owner',text:r.kpi,index:i});
   }
   if(r.approvalStatus==='Submitted'){
     items.push({type:'info',icon:'✅',title:'รออนุมัติ KPI',text:r.kpi,index:i});
   }
   if(latestActual(r)!=='' && latestActual(r)!=null && ach(r)<75){
     items.push({type:'danger',icon:'🔴',title:'Critical KPI',text:r.kpi+' · '+fmt(ach(r))+'%',index:i});
   }
 });
 return items;
}

function bulkSelectedIndexes(){

function toggleAllBulk(master){

function applyBulkEdit(){
 const ids=bulkSelectedIndexes();
 if(!ids.length){alert('กรุณาเลือก KPI อย่างน้อย 1 รายการ');return}
 const year=document.getElementById('bulkYear')?.value||'';
 const cycle=document.getElementById('bulkCycle')?.value||'';
 const owner=document.getElementById('bulkOwner')?.value||'';
 const deadline=document.getElementById('bulkDeadline')?.value||'';
 const status=document.getElementById('bulkStatus')?.value||'';
 ids.forEach(i=>{
   const r=records[i];
   if(year)r.cycleYear=year;
   if(cycle)r.evaluationCycle=cycle;
   if(owner){r.owner=owner;if(r.level!=='Organization')r.employee=r.employee||''}
   if(deadline)r.deadline=deadline;
   if(status)r.kpiStatus=status;
   r.changeLog=r.changeLog||[];r.changeLog.push({type:'Bulk Edit',at:new Date().toISOString()});
 });
 save();alert(`อัปเดต ${ids.length} KPI แล้ว`);render();
}
function finalEvalData(name,year,cycle){
 const rs=records.filter(r=>r.employee===name && (!year||String(r.cycleYear)===String(year)) && (!cycle||r.evaluationCycle===cycle));
 const totalW=rs.reduce((s,r)=>s+Number(r.weight||0),0);
 const score=rs.reduce((s,r)=>s+weightedAchievement(r),0);
 const measured=rs.filter(r=>latestActual(r)!==''&&latestActual(r)!=null);
 const rating=ratingFromAchievement(score);
 const best=measured.slice().sort((a,b)=>ach(b)-ach(a))[0];
 const weak=measured.slice().sort((a,b)=>ach(a)-ach(b))[0];
 return {rs,totalW,score,rating,best,weak,measured};
}
function closeEvaluationCycle(name,year,cycle){
 const rs=records.filter(r=>r.employee===name && String(r.cycleYear)===String(year) && r.evaluationCycle===cycle);
 if(!rs.length){alert('ไม่พบ KPI ในรอบนี้');return}
 if(!confirm(`ปิดรอบ ${cycle} ${year} ของ ${name} ใช่หรือไม่?`))return;
 rs.forEach(r=>{r.kpiStatus='Closed';r.closedAt=new Date().toISOString();r.changeLog=r.changeLog||[];r.changeLog.push({type:'Close Cycle',at:r.closedAt})});
 save();alert('ปิดรอบประเมินแล้ว');render();
}

function monthLabelFromEntry(e){
 if(e.date){
   const d=new Date(e.date);
   if(!isNaN(d)) return d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'});
 }
 return 'งวด '+e.periodNo;
}
function monthlyTrendData(name){
 const rs=records.filter(r=>r.employee===name);
 const map={};
 rs.forEach(r=>{
   (r.evaluations||[]).forEach(e=>{
     const key=monthLabelFromEntry(e);
     const tmp={...r,actual:e.actual,evaluations:[]};
     const weighted=Math.min(Math.max(ach(tmp)||0,0),150)*Number(r.weight||0)/100;
     if(!map[key])map[key]={score:0,weight:0};
     map[key].score+=weighted;
     map[key].weight+=Number(r.weight||0);
   });
 });
 return Object.entries(map).map(([label,v])=>({label,score:v.weight?Math.min(v.score,150):0}));
}
function svgLineChart(data,width=700,height=220){
 if(!data.length)return `<div class='empty-state'>ยังไม่มีข้อมูลรายเดือน</div>`;
 const pad=35,max=Math.max(100,...data.map(d=>d.score)),step=(width-pad*2)/Math.max(data.length-1,1);
 const pts=data.map((d,i)=>({x:pad+i*step,y:height-pad-(d.score/max)*(height-pad*2),...d}));
 const path=pts.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ');
 return `<svg viewBox="0 0 ${width} ${height}" class="trend-svg">
 <line x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}" stroke="#cbd8e8"/>
 <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height-pad}" stroke="#cbd8e8"/>
 <path d="${path}" fill="none" stroke="#269BE8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#1848C7"/><text x="${p.x}" y="${p.y-10}" text-anchor="middle" font-size="11" fill="#17324d">${fmt(p.score)}%</text><text x="${p.x}" y="${height-10}" text-anchor="middle" font-size="10" fill="#66788e">${p.label}</text>`).join('')}</svg>`;
}

function importBackupFile(file){
 const reader=new FileReader();
 reader.onload=()=>{
   try{
     const data=JSON.parse(reader.result);
     if(!data||!Array.isArray(data.records))throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
     if(!confirm(`นำเข้าข้อมูล ${data.records.length} KPI และแทนที่ข้อมูลปัจจุบัน ใช่หรือไม่?`))return;
     records=data.records;
     localStorage.setItem('mkpi_records',JSON.stringify(records));
     alert('Restore ข้อมูลสำเร็จ');
     current='Dashboard';render();
   }catch(err){alert('Import ไม่สำเร็จ: '+err.message)}
 };
 reader.readAsText(file);
}

function weightedAchievement(r){
 const a=latestActual(r);
 if(a===''||a==null)return 0;
 const p=Math.min(Math.max(ach(r)||0,0),150);
 const w=Number(r.weight||0);
 return p*w/100;
}
function employeeScore(name){
 const rs=records.filter(r=>r.employee===name && r.kpiStatus!=='Closed');
 const totalW=rs.reduce((s,r)=>s+Number(r.weight||0),0);
 const score=rs.reduce((s,r)=>s+weightedAchievement(r),0);
 const measured=rs.filter(r=>latestActual(r)!==''&&latestActual(r)!=null).length;
 return {rs,totalW,score,measured};
}

function onboardingStatus(){
 const org=records.filter(r=>r.level==='Organization').length;
 const deptLinked=records.filter(r=>r.level==='Department'&&r.parent).length;
 const indiv=records.filter(r=>r.level==='Individual'||(r.level==='Secondary'&&r.employee)).length;
 const actual=records.filter(r=>latestActual(r)!==''&&latestActual(r)!=null).length;
 const review=records.filter(r=>(r.reviewHistory||[]).length>0).length;
 const action=records.filter(r=>r.action).length;
 const checks=[
  {id:'org',label:'ตั้ง Organization KPI',done:org>0,count:org,page:'KPI Template by Organization',help:'กำหนด Strategic KPI ขององค์กรก่อน'},
  {id:'dept',label:'เชื่อม Department KPI',done:deptLinked>0,count:deptLinked,page:'KPI Template by Department',help:'Department KPI ต้องมี Parent Organization KPI'},
  {id:'indiv',label:'ตั้ง Operation / Employee KPI',done:indiv>0,count:indiv,page:'KPI Template by Operation',help:'กระจาย KPI ไปยังงานจริงหรือพนักงาน'},
  {id:'actual',label:'บันทึก Actual อย่างน้อย 1 งวด',done:actual>0,count:actual,page:'กรอกผล Actual',help:'ใส่ผลจริงพร้อม Evidence'},
  {id:'review',label:'มี Review History',done:review>0,count:review,page:'Review History',help:'บันทึก Self-review หรือ Manager Review'},
  {id:'action',label:'สร้าง Action จาก KPI Gap',done:action>0,count:action,page:'Action Center',help:'กำหนด Corrective Action / Owner / Due Date'}
 ];
 const done=checks.filter(x=>x.done).length;
 const pct=Math.round(done/checks.length*100);
 const next=checks.find(x=>!x.done) || {page:'Dashboard',label:'ดู Dashboard'};
 return {checks,done,pct,next};
}

function kpiExportRows(){
  let rows=(records||[]).map(r=>({...r}));

    if(!same) rows.push(d);
  }
  if(!rows.length){ alert('ยังไม่มีข้อมูล KPI สำหรับ Export'); return []; }
  return rows;
}
function kpiDirectionLabel(v){return v==='lower'?'ยิ่งต่ำยิ่งดี':'ยิ่งสูงยิ่งดี'}
function kpiAchievementValue(r){
  if(r.actual===''||r.actual==null||r.target===''||r.target==null) return '';
  const a=Number(latestActual(r)),t=Number(r.target);
  if(!isFinite(a)||!isFinite(t)||t===0) return '';
  const p=r.direction==='lower'?(a===0?150:(t/a)*100):(a/t)*100;
  return Math.round(p*10)/10;
}
function kpiStatusLabel(r){
  const p=kpiAchievementValue(r);
  if(p==='') return r._draft?'Draft':'Pending';

  if(p>=75)return 'Need Attention';
  return 'Critical';
}

function addTarget(){

   alert('กรุณาเลือก KPI');

 }
 if(targetValue===''){
   alert('กรุณากรอก Target');
   return;
 }

 const employeeName=lv==='Organization' ? '' : formValue('employee','');
 const ownerRole=lv==='Organization' ? 'องค์กร' : formValue('owner','');

   id:'KPI-'+Date.now(),
